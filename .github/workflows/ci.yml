# Тесты на всех поддерживаемых версиях PHP, проверка работы без Composer, статический анализ и стиль.
# Настоящий API здесь не вызывается: тесты идут на MockTransport, подменном PSR-18 клиенте и встроенном
# сервере PHP на 127.0.0.1.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2
      - name: Syntax of every file
        run: find src tests scripts autoload.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Works without Composer
        run: php tests/standalone.php
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --no-check-lock
      - name: Install dependencies
        id: deps
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: PHPStan (level max, PHP 7.4)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      # Стиль проверяется и при замечаниях PHPStan: одна прогонка показывает обе проблемы.
      - name: PHP-CS-Fixer (PSR-12)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Сгенерированный код должен совпадать с тем, что даёт генератор из закоммиченных спек.
      - name: Generated code is up to date
        run: |
          python scripts/generate.py
          if [ -n "$(git status --porcelain -- src)" ]; then
            git status
            git diff
            echo "Сгенерированный код устарел: запустите python scripts/generate.py и закоммитьте результат."
            exit 1
          fi
